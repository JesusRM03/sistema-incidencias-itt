name: Demo HTTPS y persistencia
on: pull_request
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test
      - name: Iniciar la demo aislada
        run: |
          npm run demo:config -- https://localhost:8443
          npm run demo:up
      - name: Comprobar TLS y MySQL
        run: |
          dc() { docker compose -p itt-demo --env-file .env.demo -f compose.demo.yaml "$@"; }
          for n in {1..60}; do dc exec -T https test -f /data/caddy/pki/authorities/local/root.crt && break; sleep 2; done
          dc cp https:/data/caddy/pki/authorities/local/root.crt /tmp/itt-demo.crt
          curl --retry 20 --retry-connrefused --retry-delay 2 --cacert /tmp/itt-demo.crt -fsS https://localhost:8443/api/salud
          dc exec -T app node --input-type=module -e 'import assert from "node:assert/strict"; import {pool,query} from "./server/db.js"; const [r]=await query(pool,"SELECT COUNT(*) AS espacios FROM espacio"); assert.equal(r.espacios,24); await pool.end()'
      - name: Reiniciar exclusivamente los datos de la demo
        run: |
          printf 'REINICIAR itt-demo\n' | npm run demo:reset
          curl --retry 20 --retry-all-errors --retry-delay 2 --cacert /tmp/itt-demo.crt -fsS https://localhost:8443/api/salud
      - name: Probar la API y la persistencia
        run: |
          docker run --rm --network itt-demo_default --env-file .env.demo --env DB_HOST=db --env PRIVATE_FILES=/app/var/evidencias --mount "type=bind,source=$GITHUB_WORKSPACE/tests,target=/app/tests,readonly" --volume itt-demo_evidence:/app/var/evidencias itt-incidencias-demo:local node --test tests/integration/api.test.js tests/integration/persistencia.test.js
      - name: Probar el navegador con la raíz HTTPS de la demo
        env:
          ITT_ENV_FILE: .env.demo
          NODE_EXTRA_CA_CERTS: /tmp/itt-demo.crt
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y libnss3-tools
          for certdb in "$HOME/.pki/nssdb" "${XDG_DATA_HOME:-$HOME/.local/share}/pki/nssdb"; do
            mkdir -p "$certdb"
            test -f "$certdb/cert9.db" || certutil -N --empty-password -d "sql:$certdb"
            certutil -A -n itt-demo -t 'C,,' -i /tmp/itt-demo.crt -d "sql:$certdb"
          done
          npm run test:e2e
      - name: Diagnóstico de arranque sin credenciales
        if: failure()
        run: |
          dc() { docker compose -p itt-demo --env-file .env.demo -f compose.demo.yaml "$@"; }
          dc ps -a
          dc logs --no-color seed | grep -E 'Error:|HttpError:|code:|errno:|sqlState:|Node.js v' | cut -c 1-250 || true
