name: Demo HTTPS y persistencia
on: pull_request
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test
      - name: Iniciar la demo aislada
        run: |
          npm run demo:config -- https://localhost:8443
          npm run demo:up
      - name: Comprobar TLS y MySQL
        run: |
          dc() { docker compose -p itt-demo --env-file .env.demo -f compose.demo.yaml "$@"; }
          for n in {1..60}; do dc exec -T https test -f /data/caddy/pki/authorities/local/root.crt && break; sleep 2; done
          dc cp https:/data/caddy/pki/authorities/local/root.crt /tmp/itt-demo.crt
          curl --retry 20 --retry-connrefused --retry-delay 2 --cacert /tmp/itt-demo.crt -fsS https://localhost:8443/api/salud
          dc exec -T app node --input-type=module -e 'import {pool,query} from "./server/db.js"; console.log(await query(pool,"SELECT COUNT(*) AS espacios FROM espacio")); await pool.end()'
      - name: Reiniciar exclusivamente los datos de la demo
        run: |
          printf 'REINICIAR itt-demo\n' | npm run demo:reset
          curl --retry 20 --retry-all-errors --retry-delay 2 --cacert /tmp/itt-demo.crt -fsS https://localhost:8443/api/salud
